[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "survivalgpu-replication-material"
version = "0.1.0"
description = "Replication material (figures, tables, benchmarks) for the survivalGPU paper"
readme = "README.md"
requires-python = ">= 3.10"
# survivalgpu is installed from its source package first, see README.md.
dependencies = [
  "survivalgpu[wce]==0.2.0",
  "numpy",
  "pandas",
  "matplotlib",
  "torch",
  "lifelines",
  "torchsurv",
  "xgboost",
  "rpy2",
]

[tool.setuptools]
py-modules = ["cox_functions", "wce_functions", "simulation_functions"]
